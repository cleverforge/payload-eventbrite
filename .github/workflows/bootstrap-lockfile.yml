name: Bootstrap package lock

on:
  push:
    branches: [core-lockfile-reproducible-ci]

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ hashFiles('package-lock.json') == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core-lockfile-reproducible-ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add npm package lockfile"
          git push origin HEAD:core-lockfile-reproducible-ci
