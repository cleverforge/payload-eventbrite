name: Publish npm beta

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag
        required: true
        default: beta
        type: choice
        options:
          - beta
          - latest

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:check
      - name: Verify prerelease tag
        if: ${{ inputs.dist_tag == 'beta' }}
        run: node -e "const v=require('./package.json').version;if(!v.includes('-beta.')){console.error('beta publishing requires a beta package version');process.exit(1)}"
      - name: Publish package
        run: npm publish --access public --tag ${{ inputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
