name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:check

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create isolated minimum-version workspace
        run: |
          mkdir -p "$RUNNER_TEMP/payload-eventbrite-min"
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=package-lock.json \
            -cf - . | tar -xf - -C "$RUNNER_TEMP/payload-eventbrite-min"
      - name: Install minimum supported Payload 3.x
        run: |
          cd "$RUNNER_TEMP/payload-eventbrite-min"
          npm pkg set "devDependencies.payload=3.0.0" "devDependencies.@payloadcms/db-sqlite=3.0.0"
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Typecheck minimum supported Payload
        run: cd "$RUNNER_TEMP/payload-eventbrite-min" && npm run typecheck
      - name: Test minimum supported Payload
        run: cd "$RUNNER_TEMP/payload-eventbrite-min" && npm test
      - name: Build minimum supported Payload
        run: cd "$RUNNER_TEMP/payload-eventbrite-min" && npm run build

  consumer-package:
    name: consumer package (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - name: minimum
            node: 20
            payload: 3.0.0
            adapter: 3.0.0
          - name: current
            node: 22
            payload: 3
            adapter: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - name: Pack plugin
        run: |
          mkdir -p "$RUNNER_TEMP/eventbrite-consumer"
          npm pack --pack-destination "$RUNNER_TEMP/eventbrite-consumer"
      - name: Install packed plugin in clean Payload consumer
        env:
          PAYLOAD_VERSION: ${{ matrix.payload }}
          ADAPTER_VERSION: ${{ matrix.adapter }}
        run: |
          cd "$RUNNER_TEMP/eventbrite-consumer"
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null
          npm install ./*.tgz "payload@$PAYLOAD_VERSION" "@payloadcms/db-sqlite@$ADAPTER_VERSION" --ignore-scripts --no-audit --no-fund
          cat > smoke.mjs <<'EOF'
          import { rm } from 'node:fs/promises'
          import { resolve } from 'node:path'
          import { sqliteAdapter } from '@payloadcms/db-sqlite'
          import { buildConfig, getPayload } from 'payload'
          import { eventbritePlugin, EventbriteClient } from '@cleverforge/payload-eventbrite'

          if (typeof eventbritePlugin !== 'function' || typeof EventbriteClient !== 'function') {
            throw new Error('Packed Core exports are incomplete')
          }

          const databasePath = resolve(process.cwd(), 'consumer-smoke.db')
          const config = buildConfig({
            secret: 'consumer-package-test-secret',
            telemetry: false,
            typescript: { autoGenerate: false },
            db: sqliteAdapter({ client: { url: 'file:' + databasePath } }),
            plugins: [
              eventbritePlugin({
                organizationId: 'consumer-test-org',
                accessToken: 'consumer-test-token',
                storeRaw: false,
              }),
            ],
          })
          const payload = await getPayload({ config, key: 'payload-eventbrite-consumer-package' })
          try {
            for (const slug of ['eventbrite-events', 'eventbrite-webhooks', 'eventbrite-venues', 'eventbrite-organizers']) {
              if (!payload.collections[slug]) throw new Error('Missing packed collection: ' + slug)
            }
          } finally {
            if (typeof payload.destroy === 'function') await payload.destroy()
            await rm(databasePath, { force: true }).catch(() => undefined)
            await rm(databasePath + '-shm', { force: true }).catch(() => undefined)
            await rm(databasePath + '-wal', { force: true }).catch(() => undefined)
          }
          EOF
          node smoke.mjs
